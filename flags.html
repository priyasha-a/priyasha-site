<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flags &amp; Capitals Quiz</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #1e3a5f 0%, #2d1b4e 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .page { width: 100%; max-width: 620px; }

  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    padding: 4px 2px;
    font-size: 14px;
    color: #8da2bd;
    text-decoration: none;
    transition: color 0.15s;
  }
  .back-link:hover { color: #fff; }

  /* The game itself — the only part that gets the raised panel. */
  .card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
  }

  h1 { margin: 0 0 4px; font-size: 26px; }

  /* ---- Flags / Capitals switch ---- */
  .mode-toggle {
    display: inline-flex;
    gap: 4px;
    background: rgba(0, 0, 0, 0.28);
    padding: 4px;
    border-radius: 99px;
    margin-bottom: 18px;
  }
  .mode-toggle button {
    border: none;
    background: transparent;
    color: #cbd5e1;
    padding: 9px 26px;
    border-radius: 99px;
    font-size: 15px;
  }
  .mode-toggle button:hover:not(.active) {
    background: rgba(255, 255, 255, 0.1);
    transform: none;
  }
  .mode-toggle button.active {
    background: #6366f1;
    color: #fff;
    font-weight: 600;
  }

  /* ---- difficulty picker ---- */
  .level-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #8da2bd;
    margin: 0 0 8px;
  }
  .levels {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .levels button {
    padding: 11px 6px;
    font-size: 14px;
    line-height: 1.3;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .levels button .n {
    display: block;
    font-size: 11.5px;
    color: #94a3b8;
    margin-top: 2px;
  }
  .levels button.active {
    background: rgba(99, 102, 241, 0.32);
    border-color: #818cf8;
    font-weight: 600;
  }
  .levels button.active .n { color: #c7d2fe; }
  .level-blurb {
    font-size: 13px;
    color: #94a3b8;
    margin: 0 0 20px;
    min-height: 19px;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #cbd5e1;
    margin-bottom: 10px;
  }

  .bar {
    height: 8px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .bar > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    transition: width 0.3s;
  }

  /* ---- the question: either a flag, or a country name ---- */
  .flag-box {
    background: rgba(0, 0, 0, 0.25);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 20px;
  }
  .flag-box img {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .country-prompt {
    background: rgba(0, 0, 0, 0.25);
    border-radius: 12px;
    padding: 34px 18px;
    margin-bottom: 20px;
  }
  .country-prompt .label {
    display: block;
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 8px;
  }
  .country-prompt .country-name { font-size: 28px; font-weight: 700; }

  /* ---- the typing box ---- */
  .answer-input {
    width: 100%;
    font: inherit;
    font-size: 17px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    text-align: center;
  }
  .answer-input:focus { outline: none; border-color: #818cf8; }
  .answer-input::placeholder { color: rgba(255, 255, 255, 0.4); }
  .answer-input:disabled { opacity: 0.6; }
  .answer-input.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
  .answer-input.wrong   { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
  .answer-input.retry   { border-color: #f59e0b; background: rgba(245, 158, 11, 0.14); }

  .btn-row { display: flex; gap: 10px; margin-top: 12px; }

  button {
    font: inherit;
    font-size: 16px;
    padding: 13px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.22);
    transform: translateY(-1px);
  }
  button:disabled { cursor: default; opacity: 0.5; }

  .primary {
    flex: 1;
    background: #6366f1;
    border-color: #818cf8;
    font-weight: 600;
  }
  .primary:hover:not(:disabled) { background: #4f46e5; }

  .feedback {
    min-height: 26px;
    margin-top: 16px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
  }
  .feedback .note {
    display: block;
    font-weight: 400;
    font-size: 14px;
    color: #cbd5e1;
    margin-top: 4px;
  }
  .feedback .hint-line {
    display: block;
    font-weight: 400;
    font-size: 15px;
    color: #fcd34d;
    margin-top: 6px;
  }
  .feedback .hint-line strong {
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  /* the memory aid */
  .tip {
    margin-top: 14px;
    padding: 12px 15px;
    background: rgba(167, 139, 250, 0.12);
    border-left: 3px solid #a78bfa;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.55;
    color: #ddd6fe;
    text-align: left;
  }
  .tip b { color: #fff; }

  .hidden { display: none; }

  .big-score { font-size: 46px; font-weight: 700; margin: 12px 0; }
  .sub { color: #cbd5e1; font-size: 15px; line-height: 1.6; }

  /* ---- reference lists, below the card and intentionally low-key ---- */
  .reference { padding: 4px 4px 0; }

  .ref-section { margin-top: 30px; text-align: left; }
  .ref-section h2 {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: #8da2bd;
    margin: 0 0 3px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .ref-section h2 .count {
    font-weight: 400;
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
    color: #7789a3;
  }
  .ref-section .caption {
    margin: 0 0 10px;
    font-size: 12.5px;
    color: #7789a3;
    line-height: 1.5;
  }

  .country-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 1px 16px;
    max-height: 250px;
    overflow-y: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.09);
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    padding: 10px 2px;
  }
  .country-grid div {
    font-size: 12.5px;
    padding: 3px 0;
    line-height: 1.35;
    color: #a8b8cd;
  }
  .country-grid .alias { color: #6d7f99; font-size: 11px; }

  .excluded-box {
    border-top: 1px solid rgba(255, 255, 255, 0.09);
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    padding: 12px 2px;
  }
  .excluded-group { margin-bottom: 12px; }
  .excluded-group:last-child { margin-bottom: 0; }
  .excluded-group .why { font-size: 11.5px; color: #6d7f99; margin-bottom: 3px; }
  .excluded-group .items { font-size: 12.5px; line-height: 1.5; color: #a8b8cd; }

  /* ---- end-of-game review lists ---- */
  .review-title {
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 24px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .review-title.hinted { color: #fcd34d; }
  .review-title.missed { color: #fca5a5; }

  .missed-list {
    max-height: 260px;
    overflow-y: auto;
    text-align: left;
    margin: 18px 0;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.22);
    padding: 8px;
  }
  .missed-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 10px;
    font-size: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .missed-row:last-child { border-bottom: none; }
  .missed-row img {
    width: 44px;
    height: 30px;
    object-fit: contain;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .missed-row .answer { color: #94a3b8; }
  .missed-row .memo {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.45;
    margin-top: 2px;
  }

  @media (max-width: 480px) {
    .levels { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="page">

<!-- Only useful once you're playing — hidden on the menu itself. -->
<a class="back-link hidden" id="back-link" href="#"
   onclick="goHome(); return false;">← Back to menu</a>

<!-- Everything you actually play with lives in the raised card. -->
<div class="card">

  <!-- ===== START SCREEN ===== -->
  <div id="start-screen">
    <div class="mode-toggle">
      <button id="mode-flags" onclick="setMode('flags')">Flags</button>
      <button id="mode-capitals" onclick="setMode('capitals')">Capitals</button>
    </div>

    <h1 id="start-title"></h1>
    <p class="sub" id="start-blurb"></p>
    <p class="sub" style="font-size:14px;" id="start-hint"></p>

    <p class="level-label">Difficulty</p>
    <div class="levels">
      <button id="level-1" onclick="setLevel(1)">Easy<span class="n"></span></button>
      <button id="level-2" onclick="setLevel(2)">Medium<span class="n"></span></button>
      <button id="level-3" onclick="setLevel(3)">Hard<span class="n"></span></button>
      <button id="level-0" onclick="setLevel(0)">All<span class="n"></span></button>
    </div>
    <p class="level-blurb" id="level-blurb"></p>

    <button class="primary" onclick="startGame()">Start Game</button>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="game-screen" class="hidden">
    <div class="stats">
      <span><span id="unit-label">Flag</span>
            <strong id="current-num">1</strong> of <strong id="total-num">197</strong></span>
      <span>Score: <strong id="score">0</strong></span>
    </div>
    <div class="bar"><div id="progress"></div></div>

    <!-- Flags mode shows this… -->
    <div class="flag-box" id="prompt-flag">
      <img id="flag-img" alt="Flag to guess">
    </div>

    <!-- …and Capitals mode shows this instead. -->
    <div class="country-prompt hidden" id="prompt-country">
      <span class="label">What is the capital of</span>
      <span class="country-name" id="prompt-country-name"></span>
    </div>

    <input id="answer" class="answer-input" type="text"
           autocomplete="off" autocorrect="off" spellcheck="false">

    <div class="btn-row">
      <button class="primary" id="check-btn" onclick="submitAnswer()">Check answer</button>
      <button id="skip-btn" onclick="skipQuestion()">Skip</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="tip hidden" id="tip"></div>
    <button class="primary hidden" id="next-btn" onclick="nextQuestion()">Next →</button>
  </div>

  <!-- ===== END SCREEN ===== -->
  <div id="end-screen" class="hidden">
    <h1>🏆 All done!</h1>
    <div class="big-score"><span id="final-score">0</span> / <span id="final-total">197</span></div>
    <p class="sub" id="final-message"></p>

    <p class="sub" id="perfect-note" style="font-weight:600;"></p>

    <!-- Right, but only after the hint -->
    <div id="hinted-wrap" class="hidden">
      <p class="review-title" id="hinted-title"></p>
      <div class="missed-list" id="hinted-list"></div>
    </div>

    <!-- Never got there -->
    <div id="missed-wrap" class="hidden">
      <p class="review-title" id="missed-title"></p>
      <div class="missed-list" id="missed-list"></div>
    </div>

    <button class="primary" onclick="startGame()">Play again</button>
    <button onclick="goHome()" style="margin-top:10px;">Back to menu</button>
  </div>

</div><!-- /card -->

<!-- Reference material: sits outside the card, deliberately quiet,
     and only shows on the menu. -->
<div class="reference" id="reference">

  <div class="ref-section">
    <h2>
      <span id="accepted-heading"></span>
      <span class="count" id="accepted-count"></span>
    </h2>
    <p class="caption" id="accepted-caption"></p>
    <div class="country-grid" id="accepted-list"></div>
  </div>

  <div class="ref-section">
    <h2><span>Not in the game</span></h2>
    <p class="caption" id="excluded-caption"></p>
    <div class="excluded-box" id="excluded-list"></div>
  </div>

</div><!-- /reference -->

</div><!-- /page -->

<script>
/* =========================================================
   1. THE DATA
   code    - 2-letter code used to fetch the flag picture
   alt     - other names for the COUNTRY that also count
   cap     - the capital city
   capAlt  - other names for the CAPITAL that also count
   tier    - 1 easy, 2 medium, 3 hard (how widely known it is)
   ftip    - memory aid for the flag
   ctip    - memory aid for the capital
   (Accents and punctuation are ignored automatically, so
    "Bogotá" and "bogota" never need a separate entry.)
========================================================= */
const COUNTRIES = [
  { name: "Afghanistan", code: "af", cap: "Kabul", tier: 2,
    ftip: "Black, red and green bands with a white mosque emblem in the middle.",
    ctip: "Picture a <b>bull</b> loose in Ka<b>bul</b>." },
  { name: "Albania", code: "al", cap: "Tirana", tier: 2,
    ftip: "A black double-headed eagle on plain red — hard to confuse with anything.",
    ctip: "<b>Tirana</b> sounds like <b>tiara</b> — Albania's crown." },
  { name: "Algeria", code: "dz", cap: "Algiers", tier: 2,
    ftip: "Green and white halves with a red crescent and star.",
    ctip: "Algeri<b>a</b> → Algier<b>s</b>. Almost the same word." },
  { name: "Andorra", code: "ad", cap: "Andorra la Vella", tier: 3,
    ftip: "Blue, yellow and red with a crest — a tiny state wedged between France and Spain, so it borrows from both flags.",
    ctip: "The capital is just the country's name with <b>la Vella</b> on the end." },
  { name: "Angola", code: "ao", cap: "Luanda", tier: 3,
    ftip: "Red over black with a machete and half cogwheel.",
    ctip: "A <b>luau</b> on Angola's Atlantic beach → <b>Luanda</b>." },
  { name: "Antigua and Barbuda", code: "ag", alt: ["antigua"], cap: "Saint John's", tier: 3,
    ftip: "A rising golden sun on black, above red and white — sunrise over the Caribbean.",
    ctip: "<b>Saint John's</b> — the same name as the capital of Newfoundland." },
  { name: "Argentina", code: "ar", cap: "Buenos Aires", tier: 1,
    ftip: "Two pale blue bands with a golden Sun of May in the centre. Uruguay's sun sits in a corner instead.",
    ctip: "<b>Buenos Aires</b> is Spanish for <b>good airs</b>." },
  { name: "Armenia", code: "am", cap: "Yerevan", tier: 2,
    ftip: "Red, blue and apricot-orange bands.",
    ctip: "<b>Yerevan</b> — you're-a-van driving through Armenia." },
  { name: "Australia", code: "au", cap: "Canberra", tier: 1,
    ftip: "Union Jack plus the Southern Cross and one large seven-pointed star. New Zealand's stars are red and there are only four.",
    ctip: "Not Sydney. A kangaroo <b>can</b> hop to Can<b>berra</b>." },
  { name: "Austria", code: "at", cap: "Vienna", tier: 1,
    ftip: "Red-white-red in three equal bands. Latvia's red is darker and its white stripe is much thinner.",
    ctip: "<b>Vienna</b> sausages come from Austria." },
  { name: "Azerbaijan", code: "az", cap: "Baku", tier: 2,
    ftip: "Blue, red and green with a crescent and an eight-pointed star.",
    ctip: "<b>Baku</b> bakes on the Caspian Sea." },
  { name: "Bahamas", code: "bs", cap: "Nassau", tier: 2,
    ftip: "Aquamarine and gold stripes with a black triangle at the hoist — sea, sand and people.",
    ctip: "<b>Nassau</b> is where the cruise ships dock." },
  { name: "Bahrain", code: "bh", cap: "Manama", tier: 3,
    ftip: "White and red with a five-pointed zigzag. Qatar's is maroon with nine points.",
    ctip: "<b>Manama</b> — ma-NAMA, your mama's in Bahrain." },
  { name: "Bangladesh", code: "bd", cap: "Dhaka", tier: 2,
    ftip: "A red circle on green, set slightly left of centre. Japan's is on white and perfectly centred.",
    ctip: "<b>Dhaka</b> rhymes with <b>docker</b> — a busy river port." },
  { name: "Barbados", code: "bb", cap: "Bridgetown", tier: 3,
    ftip: "Blue-gold-blue with a black trident head — the broken trident means a break from Britain.",
    ctip: "<b>Bridgetown</b> — a very English name for a Caribbean capital." },
  { name: "Belarus", code: "by", cap: "Minsk", tier: 2,
    ftip: "Red over green with a red-and-white embroidery pattern running down the left edge.",
    ctip: "<b>Mink</b> coats for the Belarusian winter → <b>Minsk</b>." },
  { name: "Belgium", code: "be", cap: "Brussels", tier: 1,
    ftip: "Black, yellow and red in vertical bands. Germany's are the same colours but horizontal.",
    ctip: "<b>Brussels</b> sprouts." },
  { name: "Belize", code: "bz", cap: "Belmopan", tier: 3,
    ftip: "The only national flag with human beings on it — two woodcutters in the central crest.",
    ctip: "<b>Bel</b>ize → <b>Bel</b>mopan. Both start the same." },
  { name: "Benin", code: "bj", cap: "Porto-Novo", tier: 3,
    ftip: "A green vertical band at the hoist, with yellow over red.",
    ctip: "<b>Porto-Novo</b> is Portuguese for <b>new port</b>." },
  { name: "Bhutan", code: "bt", cap: "Thimphu", tier: 3,
    ftip: "A white dragon striding across a yellow-and-orange diagonal — the Land of the Thunder Dragon.",
    ctip: "<b>Thimphu</b> sits high in the Himalayas." },
  { name: "Bolivia", code: "bo", cap: "Sucre", capAlt: ["la paz"], tier: 2,
    ftip: "Red, yellow and green with a coat of arms in the middle.",

  { name: "Bosnia and Herzegovina", code: "ba", alt: ["bosnia"], cap: "Sarajevo", tier: 2,
    ftip: "Blue with a yellow triangle and a diagonal line of white stars.",
    ctip: "<b>Sarajevo</b> hosted the 1984 Winter Olympics." },
  { name: "Botswana", code: "bw", cap: "Gaborone", tier: 3,
    ftip: "Light blue with a black stripe edged in white — water above all, in a dry country.",

  { name: "Brazil", code: "br", cap: "Brasília", tier: 1,

  { name: "Brunei", code: "bn", alt: ["brunei darussalam"], cap: "Bandar Seri Begawan", tier: 3,
    ftip: "Yellow with black and white diagonal stripes and a red crest.",
    ctip: "<b>Bandar</b> means <b>port</b> across much of Asia." },
  { name: "Bulgaria", code: "bg", cap: "Sofia", tier: 2,
    ftip: "White, green, red. Hungary is red, white, green — the reverse order.",
    ctip: "A girl named <b>Sofia</b> in Bulgaria." },
  { name: "Burkina Faso", code: "bf", cap: "Ouagadougou", tier: 3,
    ftip: "Red over green with a yellow star in the centre.",
    ctip: "<b>Ouagadougou</b> — wah-ga-DOO-goo. The most fun capital to say." },
  { name: "Burundi", code: "bi", cap: "Gitega", tier: 3,
    ftip: "A white diagonal cross splitting red and green, with three red stars in the middle.",
    ctip: "<b>Gitega</b> took over from Bujumbura in 2019." },
  { name: "Cabo Verde", code: "cv", alt: ["cape verde"], cap: "Praia", tier: 3,
    ftip: "Blue with a white-red-white stripe and a ring of ten stars for the ten islands.",
    ctip: "<b>Praia</b> is Portuguese for <b>beach</b>." },
  { name: "Cambodia", code: "kh", alt: ["kampuchea"], cap: "Phnom Penh", tier: 2,
    ftip: "The only national flag showing a building: the temple of Angkor Wat.",
    ctip: "<b>Phnom Penh</b> sits where four rivers meet." },
  { name: "Cameroon", code: "cm", cap: "Yaoundé", tier: 2,
    ftip: "Green, red and yellow vertical bands with a single yellow star in the centre.",
    ctip: "<b>Yaoundé</b> — yah-oon-DAY." },
  { name: "Canada", code: "ca", cap: "Ottawa", tier: 1,
    ftip: "The red maple leaf between two red bands.",
    ctip: "Not Toronto. <b>Ottawa</b> — oh, what a capital." },
  { name: "Central African Republic", code: "cf", alt: ["car"], cap: "Bangui", tier: 3,
    ftip: "Four horizontal stripes cut by a vertical red band, with a yellow star — it fuses French and Pan-African colours.",
    ctip: "<b>Bangui</b> sits on the Ubangi River." },
  { name: "Chad", code: "td", cap: "N'Djamena", tier: 3,
    ftip: "Blue, yellow, red — nearly identical to Romania. Chad's blue is darker; Chad is in Africa, Romania in Europe.",
    ctip: "<b>N'Djamena</b> — the apostrophe is the giveaway." },
  { name: "Chile", code: "cl", cap: "Santiago", tier: 1,

/* =========================================================
   2. MATCHING WHAT THE PLAYER TYPED
========================================================= */

/* Turn whatever was typed into a plain, comparable form:
   lowercase, no accents, no punctuation, "St." becomes "Saint",
   and a leading "the" is dropped. */
function normalize(text) {
  return text
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")  // strip accents
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9]+/g, " ")                        // punctuation -> space
    .trim()
    .replace(/^st\b/, "saint")
    .replace(/^the\b/, "")
    .replace(/\s+/g, " ")
    .trim();
}

/* Every spelling that counts as correct for a country, in a given mode. */
function answersFor(country, m) {
  return m === "capitals"
    ? [country.cap].concat(country.capAlt || [])
    : [country.name].concat(country.alt || []);
}

/* The one name we show the player when revealing the answer. */
function displayAnswer(country, m) {
  return m === "capitals" ? country.cap : country.name;
}

/* The memory aid for the current mode. */
function memoryTip(country, m) {
  return m === "capitals" ? country.ctip : country.ftip;
}

/* Pre-normalize every accepted spelling once, per mode. */
function buildLookup(m) {
  const list = [];
  COUNTRIES.forEach(function (country) {
    answersFor(country, m).forEach(function (n) {
      list.push({ country: country, key: normalize(n) });
    });
  });
  return list;
}
const LOOKUPS = { flags: buildLookup("flags"), capitals: buildLookup("capitals") };

/* How many small mistakes turn string a into string b?
   A wrong letter, a missing letter, an extra letter, or two
   neighbouring letters swapped each count as one. */
function editDistance(a, b) {
  const grid = [];
  for (let i = 0; i <= a.length; i++) grid.push([i]);
  for (let j = 0; j <= b.length; j++) grid[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      grid[i][j] = Math.min(
        grid[i - 1][j] + 1,
        grid[i][j - 1] + 1,
        grid[i - 1][j - 1] + cost
      );
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        grid[i][j] = Math.min(grid[i][j], grid[i - 2][j - 2] + 1);
      }
    }
  }
  return grid[a.length][b.length];
}

function typoAllowance(length) {
  if (length <= 3) return 0;
  if (length <= 8) return 1;
  return 2;
}

/* Decide whether the typed guess counts. Returns "exact",
   "typo" (right answer, spelled a bit off), or "wrong". */
function judge(typed, country, whichMode) {
  const activeMode = whichMode || mode;
  const lookup = LOOKUPS[activeMode];
  const guess = normalize(typed);
  if (guess === "") return "wrong";

  const exact = lookup.some(function (entry) {
    return entry.country === country && entry.key === guess;
  });
  if (exact) return "exact";

  // Which answer is their spelling closest to? Checking against every
  // country — not just the right one — stops "iraq" counting as a typo
  // for Iran, since it's a perfect match for somewhere else.
  let best = Infinity;
  let winners = new Set();
  lookup.forEach(function (entry) {
    const distance = editDistance(guess, entry.key);
    if (distance < best) {
      best = distance;
      winners = new Set([entry.country]);
    } else if (distance === best) {
      winners.add(entry.country);
    }
  });

  const allowed = typoAllowance(
    Math.min(guess.length, normalize(displayAnswer(country, activeMode)).length));
  if (best <= allowed && winners.size === 1 && winners.has(country)) {
    return "typo";
  }
  return "wrong";
}

/* =========================================================
   3. GAME STATE
========================================================= */
let mode = "flags";   // "flags" or "capitals"
let level = 1;        // 1 easy, 2 medium, 3 hard, 0 all
let deck = [];        // the shuffled countries for this round
let index = 0;        // which question we're on
let score = 0;        // total correct
let firstTry = 0;     // correct without needing the hint
let attempt = 0;      // 0 = first go, 1 = after the hint
let hinted = [];      // got there, but only after the hint
let missed = [];      // the ones we never got
let answered = false; // is this round finished?

const answerBox = document.getElementById("answer");

/* The countries in play at the current difficulty. */
function activeCountries() {
  return level === 0 ? COUNTRIES : COUNTRIES.filter(function (c) {
    return c.tier === level;
  });
}

function shuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

/* Switch which screen is visible. The reference lists live outside the
   card, so they need hiding by hand once you start playing. */
function showScreen(id) {
  ["start-screen", "game-screen", "end-screen"].forEach(function (s) {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
  document.getElementById("reference")
    .classList.toggle("hidden", id !== "start-screen");
  // No point offering a way back to the menu while you're on it.
  document.getElementById("back-link")
    .classList.toggle("hidden", id === "start-screen");
}

    listCaption: "Every answer comes from this list. Grey text marks other " +
                 "names that also count — including second capitals.",
    excludedCaption: "None of these is the answer to any question, and typing " +
                     "one won't be accepted. They're the most common wrong guesses."
  }
};

const LEVEL_BLURB = {
  1: "The countries most people can already name.",
  2: "Widely known, but the ones people hesitate on.",
  3: "Small states, island nations and the genuinely obscure.",
  0: "Every country in the game, in one long run."
};

function setMode(newMode) {
  mode = newMode;
  const t = MODE_TEXT[mode];

  document.getElementById("mode-flags").classList.toggle("active", mode === "flags");
  document.getElementById("mode-capitals").classList.toggle("active", mode === "capitals");

  document.getElementById("start-title").textContent = t.title;
  document.getElementById("start-blurb").innerHTML = t.blurb;
  document.getElementById("start-hint").textContent = t.hint;
  document.getElementById("unit-label").textContent = t.unit;
  answerBox.placeholder = t.placeholder;

  document.getElementById("accepted-heading").textContent = t.listHeading;
  document.getElementById("accepted-caption").textContent = t.listCaption;
  document.getElementById("excluded-caption").textContent = t.excludedCaption;

  buildReferenceLists();
}

function setLevel(newLevel) {
  level = newLevel;
  [0, 1, 2, 3].forEach(function (l) {
    document.getElementById("level-" + l).classList.toggle("active", l === level);
  });
  document.getElementById("level-blurb").textContent = LEVEL_BLURB[level];
  buildReferenceLists();
}

/* Put the country count inside each difficulty button. */
function labelLevels() {
  [1, 2, 3].forEach(function (l) {
    const n = COUNTRIES.filter(function (c) { return c.tier === l; }).length;
    document.getElementById("level-" + l).querySelector(".n").textContent = n;
  });
  document.getElementById("level-0").querySelector(".n").textContent = COUNTRIES.length;
}

function goHome() {
  showScreen("start-screen");
}

/* =========================================================
   5. PLAYING
========================================================= */
function startGame() {
  deck = shuffle(activeCountries());
  index = 0;
  score = 0;
  firstTry = 0;
  hinted = [];
  missed = [];
  document.getElementById("total-num").textContent = deck.length;
  document.getElementById("final-total").textContent = deck.length;
  showScreen("game-screen");
  showQuestion();
}

function showQuestion() {
  answered = false;
  attempt = 0;
  const country = deck[index];

  document.getElementById("current-num").textContent = index + 1;
  document.getElementById("score").textContent = score;
  document.getElementById("progress").style.width =
    (index / deck.length) * 100 + "%";

  document.getElementById("prompt-flag").classList.toggle("hidden", mode !== "flags");
  document.getElementById("prompt-country").classList.toggle("hidden", mode !== "capitals");

  if (mode === "flags") {
    const img = document.getElementById("flag-img");
    img.onerror = function () {
      document.getElementById("feedback").textContent =
        "Couldn't load the flag picture — check your internet connection.";
    };
    img.src = "https://flagcdn.com/w320/" + country.code + ".png";
  } else {
    document.getElementById("prompt-country-name").textContent = country.name;
  }

  answerBox.value = "";
  answerBox.disabled = false;
  answerBox.className = "answer-input";
  answerBox.focus();

  document.getElementById("check-btn").disabled = false;
  document.getElementById("check-btn").textContent = "Check answer";
  document.getElementById("skip-btn").disabled = false;
  document.getElementById("skip-btn").textContent = "Skip";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("tip").classList.add("hidden");
  document.getElementById("next-btn").classList.add("hidden");
}

/* Build the clue: the first letter, then how long each word is.
   "Saint John's" becomes "Starts with S · 5 + 5 letters".
   Punctuation is ignored, so an apostrophe doesn't show up as a
   phantom one-letter word. */
function buildHint(answer) {
  const lengths = answer.trim().split(/\s+/)
    .map(function (w) { return w.replace(/[^A-Za-zÀ-ÿ0-9]/g, "").length; })
    .filter(function (n) { return n > 0; });

  const total = lengths.reduce(function (a, b) { return a + b; }, 0);
  return "Starts with <strong>" + answer.trim().charAt(0).toUpperCase() +
         "</strong> · " + lengths.join(" + ") +
         (total === 1 ? " letter" : " letters");
}

function submitAnswer() {
  if (answered) return;
  if (normalize(answerBox.value) === "") return;

  const country = deck[index];
  const answer = displayAnswer(country, mode);
  const result = judge(answerBox.value, country);

  if (result === "exact" || result === "typo") {
    const note = result === "typo"
      ? "<span class='note'>Spelled <strong>" + answer + "</strong> — close enough.</span>"
      : "";
    if (attempt === 0) {
      firstTry++;
      finishRound(true, "✅ Correct!" + note, false);
    } else {
      hinted.push(country);
      finishRound(true, "✅ Correct — got there!" + note, true);
    }
    return;
  }

  // First miss: offer a hint and let them try once more.
  if (attempt === 0) {
    attempt = 1;
    answerBox.className = "answer-input retry";
    answerBox.value = "";
    answerBox.focus();
    document.getElementById("feedback").innerHTML =
      "Not quite — one more go." +
      "<span class='hint-line'>" + buildHint(answer) + "</span>";
    document.getElementById("check-btn").textContent = "Try again";
    document.getElementById("skip-btn").textContent = "Give up";
    return;
  }

  // Second miss: that's it.
  finishRound(false, "❌ It was <strong>" + answer + "</strong>.", true);
}

function skipQuestion() {
  if (answered) return;
  finishRound(false,
    "⏭️ It was <strong>" + displayAnswer(deck[index], mode) + "</strong>.", true);
}

/* Lock in the round. showTip controls whether the memory aid appears —
   we only show it when the answer didn't come first time. */
function finishRound(gotItRight, message, showTip) {
  answered = true;

  if (gotItRight) {
    score++;
    answerBox.classList.remove("retry");
    answerBox.classList.add("correct");
  } else {
    answerBox.classList.remove("retry");
    answerBox.classList.add("wrong");
    missed.push(deck[index]);
  }

  answerBox.disabled = true;
  document.getElementById("check-btn").disabled = true;
  document.getElementById("skip-btn").disabled = true;
  document.getElementById("score").textContent = score;
  document.getElementById("feedback").innerHTML = message;

  const tipBox = document.getElementById("tip");
  const tipText = memoryTip(deck[index], mode);
  if (showTip && tipText) {
    tipBox.innerHTML = "💡 " + tipText;
    tipBox.classList.remove("hidden");
  } else {
    tipBox.classList.add("hidden");
  }

  const nextBtn = document.getElementById("next-btn");
  nextBtn.classList.remove("hidden");
  nextBtn.focus();
}

function nextQuestion() {
  index++;
  if (index >= deck.length) {
    endGame();
  } else {
    showQuestion();
  }
}

/* =========================================================
   6. THE END SCREEN
========================================================= */
function endGame() {
  showScreen("end-screen");
  document.getElementById("final-score").textContent = score;

  const percent = Math.round((score / deck.length) * 100);
  let message;
  if (percent >= 90)      message = "Incredible — you're a world expert! 🌟";
  else if (percent >= 70) message = "Great job! You really know your stuff.";
  else if (percent >= 50) message = "Solid effort — over half right!";
  else                    message = "Nice try! Play again and you'll improve.";

  let detail = "You scored " + percent + "%. " + message;
  if (hinted.length > 0) {
    detail += "  " + firstTry + " first time, " + hinted.length + " with a hint.";
  }
  document.getElementById("final-message").textContent = detail;

  // Two review lists: the ones that needed a nudge, and the ones that
  // got away. Both carry the memory aid so this doubles as a study sheet.
  fillReview("hinted", hinted,
    "💡 Got these with a hint (" + hinted.length + ")");
  fillReview("missed", missed,
    "❌ Didn't get these (" + missed.length + ")");

  const perfect = document.getElementById("perfect-note");
  if (hinted.length === 0 && missed.length === 0) {
    perfect.textContent = "A perfect run — every one first time!";
  } else if (missed.length === 0) {
    perfect.textContent = "Nothing missed outright — just the ones below to firm up.";
  } else {
    perfect.textContent = "";
  }
}

/* Draw one of the two review lists, or hide it if there's nothing in it. */
function fillReview(which, countries, heading) {
  const wrap = document.getElementById(which + "-wrap");
  const list = document.getElementById(which + "-list");
  const title = document.getElementById(which + "-title");

  list.innerHTML = "";

  if (countries.length === 0) {
    wrap.classList.add("hidden");
    return;
  }

  wrap.classList.remove("hidden");
  title.className = "review-title " + which;
  title.textContent = heading;

  countries.forEach(function (country) {
    const row = document.createElement("div");
    row.className = "missed-row";
    const label = mode === "capitals"
      ? country.name + " <span class='answer'>— " + country.cap + "</span>"
      : country.name;
    const tipText = memoryTip(country, mode);
    row.innerHTML =
      '<img src="https://flagcdn.com/w80/' + country.code + '.png" alt="">' +
      "<span>" + label +
      (tipText ? "<span class='memo'>" + tipText + "</span>" : "") +
      "</span>";
    list.appendChild(row);
  });
}

/* =========================================================
   7. THE REFERENCE LISTS ON THE START SCREEN
========================================================= */
function buildReferenceLists() {
  const grid = document.getElementById("accepted-list");
  grid.innerHTML = "";

  const rows = activeCountries().map(function (country) {
    const answers = answersFor(country, mode);
    const main = answers[0];
    const key = normalize(main);
    // Only show alternatives that are genuinely different names; a mere
    // respelling would be clutter, since near-misses are forgiven anyway.
    const extras = answers.slice(1).filter(function (a) {
      return editDistance(normalize(a), key) > 2;
    });
    return { main: main, extras: extras };
  }).sort(function (a, b) { return a.main.localeCompare(b.main); });

  rows.forEach(function (row) {
    const div = document.createElement("div");
    div.textContent = row.main;
    if (row.extras.length) {
      const alias = document.createElement("span");
      alias.className = "alias";
      alias.textContent = " · " + row.extras.join(", ");
      div.appendChild(alias);
    }
    grid.appendChild(div);
  });

  document.getElementById("accepted-count").textContent = rows.length + " total";

  const box = document.getElementById("excluded-list");
  box.innerHTML = "";
  NOT_IN_GAME[mode].forEach(function (group) {
    const wrap = document.createElement("div");
    wrap.className = "excluded-group";
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = group.why;
    const items = document.createElement("div");
    items.className = "items";
    items.textContent = group.items.join(" · ");
    wrap.appendChild(why);
    wrap.appendChild(items);
    box.appendChild(wrap);
  });
}

/* =========================================================
   8. KEYBOARD: Enter submits, then Enter again moves on.
========================================================= */
document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  if (document.getElementById("game-screen").classList.contains("hidden")) return;
  e.preventDefault();
  if (answered) {
    nextQuestion();
  } else {
    submitAnswer();
  }
});

/* Start out on Flags, Easy. */
labelLevels();
setLevel(1);
setMode("flags");
</script>

</body>
</html>
